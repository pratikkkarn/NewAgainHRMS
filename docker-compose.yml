# Optional offline Postgres. The default setup uses a Neon `dev` branch instead (see README).
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: primestar
      POSTGRES_PASSWORD: primestar
      POSTGRES_DB: primestar_hrms
      TZ: Asia/Kolkata
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U primestar -d primestar_hrms']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
