name: CI

on:
  pull_request:
  push:
    branches: [dev, staging, main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: primestar
          POSTGRES_PASSWORD: primestar
          POSTGRES_DB: primestar_hrms_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U primestar"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://primestar:primestar@localhost:5432/primestar_hrms_test
      DIRECT_DATABASE_URL: postgresql://primestar:primestar@localhost:5432/primestar_hrms_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm --filter @primestar/db prisma:deploy
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
